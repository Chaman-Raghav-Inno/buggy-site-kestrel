[project]
name = "buggy-site-kestrel"
version = "0.1.0"
description = "Kestrel Works: an HR and payroll portal with planted functional bugs, for testing the AI QA Scanner"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
